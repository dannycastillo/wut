# .ai-harness.conf — sourced as POSIX sh by the installed aih (ADR-09).
# Everything project-specific lives here; the harness itself knows no Go.

AI_HARNESS_PROJECT="wut"
AI_HARNESS_TRUNK="aih-20261001-public-prep"
AI_HARNESS_WORKTREE_ROOT="../wut-worktrees"
AI_HARNESS_PREFIXES="feat fix doc chore"
AI_HARNESS_MAX_WORKERS=3
AI_HARNESS_DIFF_SOFT_LIMIT=400
AI_HARNESS_PUSH_TRUNK="yes"

# Unset: the harness prints the command and the boot prompt to run yourself.
# That is a supported path, not a degraded one — it is what lets the harness
# work on a platform nobody has written an adapter for. A detached agent needs
# whatever flag its CLI takes to act without prompting; that flag goes here.
AI_HARNESS_AGENT_CMD="claude --model sonnet --allowedTools Read,Edit,Write,Bash --permission-prompts none --max-budget-usd 10 -p"

# run kills an agent past this many seconds, and checks every POLL seconds.
AI_HARNESS_AGENT_TIMEOUT=3600
AI_HARNESS_RUN_POLL=10

# Only gates that can actually run.
AI_HARNESS_GATES="build vet fmt test lint"
AI_HARNESS_QUICK_GATES="build vet"

ai_harness_gate_build() { go build ./...; }
ai_harness_gate_vet() { go vet ./...; }
ai_harness_gate_fmt() {
	out=$(gofmt -l .)
	[ -z "$out" ] || {
		printf '%s\n' "$out"
		return 1
	}
}
ai_harness_gate_test() { go test -race ./...; }
# .golangci.yml uses golangci-lint's own default linter set (errcheck,
# gosimple, govet, ineffassign, staticcheck, unused) plus exclusions for real
# findings this todo's Touches doesn't cover fixing; see that file for why.
ai_harness_gate_lint() { golangci-lint run; }

# What each gate needs on PATH, asserted before any gate runs.
AI_HARNESS_GATE_TOOLS_build="go"
AI_HARNESS_GATE_TOOLS_vet="go"
AI_HARNESS_GATE_TOOLS_fmt="gofmt"
AI_HARNESS_GATE_TOOLS_test="go"
AI_HARNESS_GATE_TOOLS_lint="golangci-lint"

# Gates holding a global resource, serialized across every worktree by one
# lock. go test drives a named tmux session, so two runs collide.
AI_HARNESS_EXCLUSIVE_GATES="test"

AI_HARNESS_PROTECTED="go.mod go.sum .github/workflows/* .golangci.yml"
