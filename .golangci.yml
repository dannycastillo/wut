version: "2"

linters:
  default: standard
  exclusions:
    rules:
      # Real errcheck findings, out of scope for chore-add-ci: its Touches is
      # CI config, not these source files, and internal/ui/list_picker.go is
      # also claimed right now by feat/help-above-results. Filed as
      # chore-check-lint-errcheck-findings; drop each rule as that lands.
      - path: cmd/root.go
        linters:
          - errcheck
      - path: cmd/root_test.go
        linters:
          - errcheck
      - path: internal/search/scan.go
        linters:
          - errcheck
      - path: internal/ui/list_picker.go
        linters:
          - errcheck
