# .ai-harness.conf — sourced as POSIX sh by ai-harness/bin/aih.
# Everything project-specific lives here; nothing under ai-harness/ knows the
# project's language.

AI_HARNESS_PROJECT="@PROJECT@"
AI_HARNESS_TRUNK="@TRUNK@"
AI_HARNESS_WORKTREE_ROOT="@WORKTREE_ROOT@"
AI_HARNESS_PREFIXES="feat fix doc chore"
AI_HARNESS_MAX_WORKERS=3
AI_HARNESS_DIFF_SOFT_LIMIT=400
AI_HARNESS_PUSH="no"

# Unset: the harness prints the command and the boot prompt to run yourself.
# That is a supported path, not a degraded one — it is what lets the harness
# work on a platform nobody has written an adapter for. A detached agent needs
# whatever flag its CLI takes to act without prompting; that flag goes here.
# AI_HARNESS_AGENT_CMD="claude --allowedTools Read,Edit,Write,Bash --permission-prompts none -p"

# run kills an agent past this many seconds, and checks every POLL seconds.
AI_HARNESS_AGENT_TIMEOUT=3600
AI_HARNESS_RUN_POLL=10

# Written by ai-harness/install.sh from @DETECTED@. Read it before trusting
# it: a wrong gate is worse than no gate, because it discredits every result
# the harness reports afterwards.
@GATES@

# No gate function tests for its own tool: a gate that returns 0 because its
# tool is absent reports the branch as clean when nothing examined it.
# Preflight refuses to run a declared gate whose tool is missing, so the honest
# way to not have a linter is to not declare the gate.
ai_harness_gate_shellcheck() {
	shellcheck -s sh ai-harness/bin/aih ai-harness/install.sh ai-harness/lib/*.sh ai-harness/verbs/*.sh
}
AI_HARNESS_GATE_TOOLS_shellcheck="shellcheck"

# The merge gate is only worth trusting if someone actually reads it, so the
# harness's own source is capped per file rather than in total.
AI_HARNESS_SHELL_MAX_LINES=400
ai_harness_gate_shellsize() {
	_over=$(wc -l ai-harness/bin/aih ai-harness/install.sh ai-harness/lib/*.sh ai-harness/verbs/*.sh |
		awk -v m="$AI_HARNESS_SHELL_MAX_LINES" '$2 != "total" && $1 > m { print "  " $2 ": " $1 " lines" }')
	[ -z "$_over" ] || {
		printf 'over %s lines — split it:\n%s\n' "$AI_HARNESS_SHELL_MAX_LINES" "$_over"
		return 1
	}
}
AI_HARNESS_GATE_TOOLS_shellsize="wc awk"

# Gates holding a global resource, serialized across every worktree by one
# lock.
AI_HARNESS_EXCLUSIVE_GATES=""

# Paths a branch may only change when its todo's Touches names them.
AI_HARNESS_PROTECTED=""
