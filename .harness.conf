# .harness.conf — sourced as POSIX sh by harness/bin/harness (ADR-09).
# Everything project-specific lives here; nothing else in harness/ knows Go.

HARNESS_PROJECT="wut"
HARNESS_TRUNK="main"
HARNESS_WORKTREE_ROOT="../wut-command-worktrees"
HARNESS_PREFIXES="feat fix doc chore"
HARNESS_MAX_WORKERS=3
HARNESS_DIFF_SOFT_LIMIT=400
HARNESS_PUSH="no"

# Unset: the harness prints the command and the boot prompt to run yourself.
# That is a supported path, not a degraded one — it is what lets the harness
# work on a platform nobody has written an adapter for. A detached agent needs
# whatever flag its CLI takes to act without prompting; that flag goes here.
# HARNESS_AGENT_CMD="claude"

# run kills an agent past this many seconds, and checks every POLL seconds.
HARNESS_AGENT_TIMEOUT=3600
HARNESS_RUN_POLL=10

# Only gates that can actually run.
# lint arrives with chore-add-ci.
HARNESS_GATES="build vet fmt test shellcheck shellsize"
HARNESS_QUICK_GATES="build vet"

harness_gate_build() { go build ./...; }
harness_gate_vet() { go vet ./...; }
harness_gate_fmt() {
	out=$(gofmt -l .)
	[ -z "$out" ] || {
		printf '%s\n' "$out"
		return 1
	}
}
harness_gate_test() { go test -race ./...; }
# Defined but not declared in HARNESS_GATES, because neither tool is installed
# yet. No gate function tests for its own tool: a gate that returns 0 because
# its tool is absent reports the branch as clean when nothing examined it.
# Preflight refuses to run a declared gate whose tool is missing, so the honest
# way to not have a linter is to not declare the gate. lint arrives with
# chore-add-ci, which is what introduces .golangci.yml.
harness_gate_lint() { golangci-lint run; }
harness_gate_shellcheck() {
	shellcheck -s sh harness/bin/harness harness/lib/*.sh harness/verbs/*.sh
}

# The merge gate is only worth trusting if someone actually reads it, so the
# harness's own source is capped per file rather than in total. A total was
# tried and abandoned: it says nothing about whether any single file can be
# held in the head, and it turns every addition into a negotiation.
HARNESS_SHELL_MAX_LINES=400
harness_gate_shellsize() {
	_over=$(wc -l harness/bin/harness harness/lib/*.sh harness/verbs/*.sh |
		awk -v m="$HARNESS_SHELL_MAX_LINES" '$2 != "total" && $1 > m { print "  " $2 ": " $1 " lines" }')
	[ -z "$_over" ] || {
		printf 'over %s lines — split it:\n%s\n' "$HARNESS_SHELL_MAX_LINES" "$_over"
		return 1
	}
}

# What each gate needs on PATH, asserted before any gate runs.
HARNESS_GATE_TOOLS_build="go"
HARNESS_GATE_TOOLS_vet="go"
HARNESS_GATE_TOOLS_fmt="gofmt"
HARNESS_GATE_TOOLS_test="go"
HARNESS_GATE_TOOLS_lint="golangci-lint"
HARNESS_GATE_TOOLS_shellcheck="shellcheck"
HARNESS_GATE_TOOLS_shellsize="wc awk"

# Gates holding a global resource, serialized across every worktree by one
# lock. go test drives a named tmux session, so two runs collide.
HARNESS_EXCLUSIVE_GATES="test"

HARNESS_PROTECTED="go.mod go.sum .github/workflows/* .golangci.yml"
